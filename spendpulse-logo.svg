<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Icon Mark: Pulse Node inside rounded hexagon/shield -->
  <rect x="2" y="4" width="32" height="32" rx="8" fill="url(#logo_grad)" fill-opacity="0.15" stroke="url(#logo_grad)" stroke-width="1.5"/>
  <path d="M8 20H13L16 13L20 27L23 17L25 20H30" stroke="url(#logo_grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="27" r="2" fill="#06b6d4"/>

  <!-- Logo Text: SpendPulse -->
  <text x="44" y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="17" fill="#fafafa" letter-spacing="-0.02em">
    Spend<tspan fill="#06b6d4">Pulse</tspan>
  </text>
  
  <!-- Subtitle Tagline: Customer Intelligence -->
  <text x="44" y="33" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" fill="#a3adc2" letter-spacing="0.12em" text-transform="uppercase">
